# Explicit opt-in: privileged Docker-in-Docker for local development/testing.
# Use the .env generated by: python3 scripts/setup.py --sandbox
services:
  n8n:
    environment:
      N8N_ENABLED_MODULES: instance-ai
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_SANDBOX_SERVICE_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: ${SANDBOX_API_KEY:?Run setup.py --sandbox first}
      N8N_INSTANCE_AI_MODEL: ${N8N_INSTANCE_AI_MODEL:-}
      N8N_INSTANCE_AI_MODEL_URL: ${N8N_INSTANCE_AI_MODEL_URL:-}
      N8N_INSTANCE_AI_MODEL_API_KEY: ${N8N_INSTANCE_AI_MODEL_API_KEY:-}
      N8N_INSTANCE_AI_SEARXNG_URL: http://searxng:8080
      N8N_INSTANCE_AI_LOCAL_GATEWAY_DISABLED: "true"
    depends_on:
      sandbox-api:
        condition: service_healthy
      searxng:
        condition: service_healthy

  sandbox-certs:
    image: ${SANDBOX_API_IMAGE:-ghcr.io/n8n-io/n8n-sandbox-service-api:${SANDBOX_VERSION:-latest}}
    user: "0:0"
    entrypoint: [sh, -c]
    command:
      - >-
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner &&
        chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - sandbox_tls:/tls

  sandbox-api:
    image: ${SANDBOX_API_IMAGE:-ghcr.io/n8n-io/n8n-sandbox-service-api:${SANDBOX_VERSION:-latest}}
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEY:?Run setup.py --sandbox first}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_REGISTRATION_TOKEN:?Run setup.py --sandbox first}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_RUNNER_API_KEY:?Run setup.py --sandbox first}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox_tls:/tls:ro
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  sandbox-runner-1:
    image: ${SANDBOX_RUNNER_IMAGE:-ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${SANDBOX_VERSION:-latest}}
    restart: unless-stopped
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_RUNNER_API_KEY:?Run setup.py --sandbox first}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_REGISTRATION_TOKEN:?Run setup.py --sandbox first}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ${SANDBOX_WORKLOAD_IMAGE:-ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${SANDBOX_VERSION:-latest}}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox_tls:/tls:ro
      - sandbox_docker:/var/lib/docker
    healthcheck:
      test: [CMD-SHELL, "docker info > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  sandbox_tls:
  sandbox_docker:
