# Base: n8n + PostgreSQL + external Code-node runners.
# setup.py --sandbox also enables compose.sandbox.yml and the search profile.
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    <<: *service-defaults
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-stable}
    ports:
      - "${N8N_LISTEN_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.py first}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run setup.py first}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Seoul}
      TZ: ${GENERIC_TIMEZONE:-Asia/Seoul}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data/shared
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Run setup.py first}
      N8N_RUNNERS_TASK_TIMEOUT: "3600"
      CREDENTIALS_OVERWRITE_DATA_FILE: /run/secrets/google-oauth.json
      EXECUTIONS_TIMEOUT: "3600"
      EXECUTIONS_TIMEOUT_MAX: "7200"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/shared:/data/shared
    secrets:
      - source: google_oauth
        target: google-oauth.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  task-runners:
    <<: *service-defaults
    image: n8nio/runners:${N8N_VERSION:-stable}
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Run setup.py first}
      N8N_RUNNERS_TASK_TIMEOUT: "3600"
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "600"
    depends_on:
      n8n:
        condition: service_healthy

  searxng:
    <<: *service-defaults
    image: ${SEARXNG_IMAGE:-ghcr.io/searxng/searxng:latest}
    profiles: [search]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run setup.py first}
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    profiles: [memory, tools]
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:?Run setup.py first}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run setup.py first}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  redisinsight:
    <<: *service-defaults
    image: ${REDISINSIGHT_IMAGE:-redis/redisinsight:latest}
    profiles: [tools]
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  qdrant:
    <<: *service-defaults
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    profiles: [vector]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run setup.py first}
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

secrets:
  google_oauth:
    file: ./.local/google-oauth.json

volumes:
  postgres_data:
  n8n_data:
  searxng_data:
  redis_data:
  redisinsight_data:
  qdrant_data:
